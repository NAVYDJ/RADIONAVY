<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVY-RADIO Online | Mejores DJs</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #02010a, #0a0033, #000000);
      color: #00ffe5;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      padding: 30px;
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid #00ffe5;
      box-shadow: 0 0 30px #00ffe5;
    }
    header h1 {
      font-size: 3em;
      text-shadow: 0 0 15px #00ffe5, 0 0 25px #ff00ff;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #00ffe5; }
      to { text-shadow: 0 0 30px #ff00ff; }
    }
    .dj-banner {
      font-size: 1.2em;
      color: #ff00ff;
      margin-top: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffe5;
    }
    .player {
      margin: 40px auto;
      padding: 25px;
      border: 2px solid #00ffe5;
      border-radius: 20px;
      width: 380px;
      background: rgba(10, 10, 40, 0.8);
      box-shadow: 0 0 35px #00ffe5, 0 0 45px #ff00ff;
    }
    audio {
      width: 100%;
      border-radius: 12px;
      outline: none;
    }
    .djs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 40px 20px;
    }
    .dj-card {
      background: rgba(10,10,40,0.85);
      border: 1px solid #00ffe5;
      border-radius: 15px;
      width: 180px;
      padding: 15px;
      box-shadow: 0 0 20px #00ffe5;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .dj-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px #ff00ff;
    }
    .dj-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .dj-card h3 {
      margin: 0;
      font-size: 1.1em;
      color: #ff00ff;
    }
    .dj-card p {
      font-size: 0.85em;
      color: #00ffe5;
      margin: 5px 0 0 0;
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.9);
      font-size: 0.9em;
      color: #888;
      text-shadow: 0 0 10px #00ffe5;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 NAVY-RADIO Online 🎧</h1>
    <div class="dj-banner">Los mejores DJs del momento 🌌</div>
  </header>

  <!-- Reproductor de música -->
  <section class="player">
    <h2>🎶 Escucha en vivo</h2>
    <audio controls autoplay>
      <source src="https://uk23freenew.listen2myradio.com/live.mp3?typeportmount=s1_16304_stream_790154007">
       </audio>
  </section>

  <!-- Sección de DJs -->
  <section class="djs">
    <div class="dj-card">
      <img src="https://static.wixstatic.com/media/457323_a697a6ae66904ecd86864ec83ef22d63~mv2.png?text=DJ+NAVY" alt="DJ NAVY">
      <h3>DJ NAVY</h3>
      <p>Estilo futurista y techno cósmico</p>
    </div>
    <div class="dj-card">
      <img src="https://static.wixstatic.com/media/457323_6ac117a6dab74684ab55b7f7b7ffa930~mv2_d_2560_1600_s_2.png?text=DJ+FIDEL YUMISACA" alt="FIDEL YUMISACA">
      <h3>DJ CANELA</h3>
      <p>Ritmos urbanos y bass electrizante</p>
    </div>
    <div class="dj-card">
      <img src="https://static.wixstatic.com/media/457323_117cd044f6f148f7ac1d17be12c96fb9~mv2.png?text=DJ+PAUL" alt="DJ OVNI">
      <h3>DJ OVNI</h3>
      <p>Deep house y beats progresivos</p>
    </div>
    <!-- Puedes agregar más DJs aquí -->
  </section>

  <footer>
    NAVY-RADIO © 2025 | DJ NAVY y los mejores DJs del momento 🚀✨
  </footer>

</body>
</html>
